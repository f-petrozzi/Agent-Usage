name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            tests/browser/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: desktop
      - run: npm ci
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - name: Check shared session, geometry and platform behavior
        run: node scripts/test-desktop.cjs
      - name: Check collector fixtures
        run: python scripts/test-collector.py
      - name: Check browser interactions and motion sequentially
        run: node scripts/test-browser.cjs
        env:
          AGENT_USAGE_BROWSER_OUTPUT: ${{ runner.temp }}/agent-usage-browser-checks
      - name: Preserve browser logs and synthetic previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AgentUsage-Browser-Checks
          path: ${{ runner.temp }}/agent-usage-browser-checks
  package:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Compile helper and parse installers
        shell: powershell
        run: |
          Get-ChildItem windows/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:exe /optimize+ /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /out:desktop\resources\InputMonitor.exe desktop\InputMonitor.cs
          if ($LASTEXITCODE -ne 0) { throw 'Helper compilation failed' }
      - run: npm ci
        working-directory: desktop
      - name: Verify native session shortcut and keyboard focus
        run: node tests/shortcut-windows.cjs
      - name: Verify native file and screenshot attachments
        run: node tests/attachment-electron.cjs
      - run: node scripts/test-desktop.cjs
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package version' }
      - run: python scripts/package-vscode-link.py
      - run: npm run pack:windows
        working-directory: desktop
      - name: Verify packaged VS Code helper installation
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'agent-usage-vscode-check'
          New-Item -ItemType Directory -Force $testRoot | Out-Null
          $archive = Join-Path $testRoot 'code.zip'
          Invoke-WebRequest 'https://update.code.visualstudio.com/latest/win32-x64-archive/stable' -OutFile $archive
          $codeRoot = Join-Path $testRoot 'code'
          Expand-Archive $archive $codeRoot
          node tests/vscode-install-windows.cjs "$codeRoot\Code.exe" "$PWD\desktop\dist\win-unpacked\resources\agent-usage-link.vsix" "$testRoot\isolated-data"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged VS Code helper installation failed' }
      - run: python scripts/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: AgentUsage-Windows
          path: |
            preview/downloads/AgentUsage-Setup-*.exe
            preview/downloads/*.blockmap
            preview/downloads/latest.yml
            preview/downloads/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: AgentUsage-Windows
          path: release
      - name: Publish matching installer and update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --title "Agent Usage ${RELEASE_TAG#v}" --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Push signed release notice
        env:
          AGENT_USAGE_RELEASE_PUSH_KEY: ${{ secrets.AGENT_USAGE_RELEASE_PUSH_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-release-push.cjs
