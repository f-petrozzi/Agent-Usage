<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<style>
  /* The palette. Dark is the notch as it has always been drawn; light is the same shapes in the
     inks Settings already uses, plus the Mac's own light secondary (#6b6b6b, Palette.textSecondary).
     Which of the two is drawn is Rust's answer to get_theme_resolved, never a guess made here. */
  :root{
    --pill:#000; --edge:#2e2e2e; --rest-edge:#5c5c5c; --card:#0a0a0a; --card-line:#242424; --card-rule:#1e1e1e;
    --bar:#2d2d2d; --track:#303030; --hole:#2a2a2a;
    --ample:#00FF88; --watch:#F2FF00; --crit:#FF3F00;
    --ink:#ffffff; --ink-2:#e8e8ea; --ink-3:#c8c8c8; --ink-4:#b0b0b3; --ink-dim:#808080;
    --btn:#252525; --btn-line:#555; --btn-hover:#383838; --btn-line-hover:#aaa;
    --armed:rgba(0,0,0,.72);
  }
  /* Rust resolves the choice. Light, Dark, or what Windows is set to. and the page is told, rather
     than reading prefers-color-scheme: correcting a live window's theme does not reliably reach
     WebView2's own scheme, which left a dark page under a light Mica. */
  :root[data-theme="light"]{
    --pill:#f5f5f7; --edge:#d2d2d7; --rest-edge:#86868b; --card:#ffffff; --card-line:#e4e4e8; --card-rule:#e8e8ec;
    --bar:rgba(0,0,0,.15); --track:rgba(0,0,0,.16); --hole:#ffffff;
    /* Palette.ample and .watch carry a light value of their own; .critical is "already 3.5:1 on
       white", in its words, so it is the one band that does not change. */
    --ample:#00A356; --watch:#B08800; --crit:#FF3F00;
    --ink:#1d1d1f; --ink-2:#1d1d1f; --ink-3:#3c3c43; --ink-4:#4a4a4f; --ink-dim:#6b6b6b;
    --btn:#ffffff; --btn-line:#c6c6cc; --btn-hover:#f0f0f2; --btn-line-hover:#8e8e93;
    --armed:rgba(255,255,255,.78);
  }
  .c-auth{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .c-auth button{font:inherit;font-size:11px;color:var(--ink);background:var(--btn);border:1px solid var(--btn-line);border-radius:7px;padding:6px 9px;cursor:pointer}
  .c-auth button:hover,.c-auth button:focus-visible{background:var(--btn-hover);border-color:var(--btn-line-hover)}
  .c-auth button:disabled{opacity:.5;cursor:wait}
  .c-auth-status{font-size:10px;line-height:1.4;color:var(--ink-3);margin-top:6px;overflow-wrap:anywhere}
  /* Visual reference: upstream docs/specs/2026-08-28-usage-notch-design.md, reproduced for Windows */
  *{box-sizing:border-box} /* content-box padding once pushed the card past the window's left edge */
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none}
  body{font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink)}
  #root{position:relative;width:100%;height:100%}

  /* The pill on the right edge */
  #pill{
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    width:70px;padding:18px 0;background:var(--pill);
    border-radius:20px 0 0 20px;
    /* Stays visible on dark wallpapers: a thin stroke plus a faint glow, the only outline when black sits on black */
    border:1px solid var(--edge);border-right:none;
    box-shadow:none;
    display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;
  }
  /* Fillets: the concave arcs between the pill's top/bottom and the screen edge (the inverse rounded
     corner in the upstream design frame). An R×R black square hugs the edge and a radial gradient
     punches out the circle of radius R centred on its outer corner; what remains is the arc. A 1 px
     ring in the stroke colour joins the pill's own stroke (the outline cue on black wallpapers). */
  #pill::before,#pill::after{
    content:"";position:absolute;right:0;width:var(--fillet);height:var(--fillet);pointer-events:none;
  }
  /* The Mac's flare radius (38.7 pt against the same 70 pt body), so the settings orb that nests in
     this pocket can be the Mac's own size */
  #pill{--fillet:38.7px}
  #pill::before{
    top:calc(-1 * var(--fillet)); /* covers the 1 px stroke along the pill's top edge so there is no seam */
    background:radial-gradient(circle at 0 0, transparent calc(var(--fillet) - .25px), var(--pill) calc(var(--fillet) + .75px));
  }
  #pill::after{
    bottom:calc(-1 * var(--fillet));
    background:radial-gradient(circle at 0 100%, transparent calc(var(--fillet) - .25px), var(--pill) calc(var(--fillet) + .75px));
  }
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  /* The ring takes the Mac's own share of the body, NotchLayout.ringDiameter against sideBodyDepth: 44 in
     70. At 56 it left an outside weekly ring 2.8 px from the screen edge, where the Mac keeps it about 10
     clear ("far enough in that the bezel is never touched"). The arcs are drawn in a 56-unit viewBox and
     scale with the ring on their own; the glyphs are sized here in px, so they take the same factor. */
  :root{--ring:44px;--k:calc(44 / 56)}
  .ringwrap{position:relative;width:var(--ring);height:var(--ring);transition:transform .3s cubic-bezier(.34,1.4,.64,1)}
  .ringwrap.pressed{transform:scale(.93)}
  .ringwrap > svg.ring,.ringwrap > svg.reading,.activity-layer > svg.activity{position:absolute;inset:0;overflow:visible} /* pins only the ring itself; an inline logo svg must not match this or it ends up in the top-left corner */
  .glyph{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:calc(20px * var(--k));font-weight:700;color:var(--ink-2);letter-spacing:-.5px;
  }
  .glyph.small{font-size:calc(15px * var(--k))}
  /* Glyphs: mark = the provider's own brand mark (monochrome, shown white); appicon = the installed app's icon (colour, rounded and shrunk) */
  .glyph img,.glyph svg{display:block;pointer-events:none;user-select:none}
  .glyph .mark{display:block;width:calc(26px * var(--k));height:calc(26px * var(--k));color:var(--ink-2)}
  .glyph .mark svg{width:calc(26px * var(--k));height:calc(26px * var(--k));fill:currentColor} /* inline SVG follows currentColor, so it dims together with the cell */
  .glyph img.png{width:calc(26px * var(--k));height:calc(26px * var(--k));object-fit:contain}
  .glyph img.appicon{width:calc(30px * var(--k));height:calc(30px * var(--k));border-radius:calc(8px * var(--k));object-fit:cover}
  .c-head .mark{display:inline-block;width:16px;height:16px;color:var(--ink-2);margin-right:2px}
  .c-head .mark svg{width:16px;height:16px;fill:currentColor}
  .pct{font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .dim{opacity:.55}
  /* A stale reading dims the reading only. The track, the week and the glyph are all saying the same
     old thing, but whether an agent is running right now is current either way, so the activity arc
     keeps its strength. the Mac puts its own ActivityArc outside the opacity it gives the stale
     stack (ProviderRing), and TASKS.md says it outright: dimming applies to the usage reading. */
  .ringwrap.stale > svg.ring,.ringwrap.stale > svg.reading,.ringwrap.stale > .glyph{opacity:.55}
  /* Session arc animation */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  /* Rotate a small HTML compositor layer, not an SVG group that repaints the
     transparent overlay. The arc stays rasterized while its texture turns at vsync. */
  .activity-layer{position:absolute;inset:0;z-index:1;pointer-events:none;transform-origin:50% 50%}
  .activity-layer > svg.activity{width:100%;height:100%}
  .activity-layer.running{animation:spin 1.2s linear infinite;will-change:transform}
  #root:not(.visible) .activity-layer.running,.compact-account .activity-layer.running{animation-play-state:paused;will-change:auto}
  .arc-pulse{animation:pulse 1.1s steps(6) infinite}
  /* Windows' Animation effects switch: a still arc and a solid ring, as on the Mac under Reduce Motion */
  @media (prefers-reduced-motion: reduce){.activity-layer.running,.arc-pulse{animation:none;will-change:auto}.ringwrap{transition:none}}

  /* Hover card, shown to the left of the pill */
  #card{
    position:absolute;left:10px;right:100px;top:50%;transform:translateY(-50%);
    /* Anchored on both sides = fluid width: whatever the WebView's real logical width, the card cannot
       extend past the window's left edge (a fixed max-width got clipped when the DPI disagreed).
       The 246 cap matches the upstream spec. */
    max-width:246px;margin-left:auto;background:var(--card);border-radius:16px;padding:16px;
    overflow-wrap:anywhere;min-width:0;
    max-height:calc(100% - 16px);overflow-x:hidden;overflow-y:auto;scrollbar-width:thin; /* actions stay reachable in a tall card */
    display:none;
  }
  #card.show{display:block}
  /* The tail, its point on the hovered ring: the Mac's curved wedge (TooltipTail), whose shoulders
     leave the card tangent to its edge so the two read as one shape. An element of its own rather
     than ::after, so the card's overflow cannot clip it and it can be reported as hot. It spans the
     whole gap, its tip tucked 1 px under the pill's edge so the two meet. */
  #tail{
    position:absolute;right:69px;width:32px;height:36px;background:var(--card);display:none;
    clip-path:path('M0 0C0 9 18.56 13.68 32 18C18.56 22.32 0 27 0 36Z');
  }
  #card.show + #tail{display:block}
  .c-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .c-title{font-size:14px;font-weight:700}
  .c-sub{font-size:11px;color:var(--ink-dim);margin-bottom:10px}
  .win{margin-top:10px}
  .w-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;flex-wrap:wrap;column-gap:8px}
  .w-label{color:var(--ink-2);font-weight:600;white-space:nowrap}
  .w-reset{color:var(--ink-dim);font-size:11px;white-space:nowrap;margin-left:auto} /* wrap as a whole when it does not fit; never break inside a word */
  .w-track{height:4px;border-radius:2px;background:var(--bar);margin:6px 0 4px;overflow:hidden}
  .w-fill{height:100%;border-radius:2px}
  .w-used{font-size:11px;color:var(--ink-dim)}
  .g-head{font-size:12px;font-weight:700;color:var(--ink-2);margin-top:12px}
  .g-box{border:1px solid var(--card-line);border-radius:10px;padding:0 10px 8px;margin-top:6px}
  .c-note{font-size:12px;color:var(--ink-3);line-height:1.5;margin-top:6px}
  .c-sessions{margin-top:12px;border-top:1px solid var(--card-rule);padding-top:8px}
  .s-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-4);padding:2px 0}
  .s-dot{width:6px;height:6px;border-radius:3px;flex:0 0 auto}
  .s-more{font-size:11px;color:var(--ink-dim);padding:2px 0}
  /* A window reads as its share used beside its name, the bar, then when it resets and what is left */
  .w-pct{margin-left:auto;font-size:13px;font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  .w-foot{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;column-gap:8px;font-size:11px;color:var(--ink-dim)}
  .w-foot .w-reset{margin-left:0}
  .w-left{white-space:nowrap;font-variant-numeric:tabular-nums}
  /* Resets: a quiet filled row of their own, since one is worth noticing */
  .c-resets{margin-top:12px;padding:7px 10px;border-radius:10px;background:#151515;font-size:12px;color:var(--ink-2);outline:none;
    transition:background-color .2s ease}
  .r-head{display:flex;align-items:center;gap:8px}
  .r-ico{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
    transition:transform .5s cubic-bezier(.34,1.3,.64,1)}
  .r-count{font-weight:600}
  .r-until{margin-left:auto;padding-left:8px;color:var(--ink-dim);white-space:nowrap;transition:opacity .2s ease}
  /* Opened, it lists each reset against its date, soonest first; the summary date gives way to them and the
     arrow turns once, as if winding back. The notch's ink grows with the row (ResizeObserver in notch.js). */
  .c-resets.expandable{cursor:default}
  .c-resets.open{background:#1b1b1b}
  .c-resets.open .r-ico{transform:rotate(-360deg)}
  .c-resets.open .r-until{opacity:0}
  .r-list{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s cubic-bezier(.32,.72,.24,1)}
  .r-list > div{overflow:hidden;min-height:0}
  .c-resets.open .r-list{grid-template-rows:1fr}
  .r-item{display:flex;align-items:baseline;gap:8px;padding:7px 0 0 22px;font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;
    opacity:0;translate:0 -3px;transition:opacity .16s ease,translate .3s cubic-bezier(.32,.72,.24,1)}
  .c-resets.open .r-item{opacity:1;translate:0 0;transition-delay:.08s}
  .r-times{color:var(--ink);font-weight:650}
  .r-rel{margin-left:auto;padding-left:8px;color:var(--ink-dim);white-space:nowrap}
  .c-resets:focus-visible{box-shadow:0 0 0 1px #888}
  @media (prefers-reduced-motion: reduce){.r-list,.r-item,.r-ico,.r-until{transition:none}}
  /* Alerts: a sliver of the notch from the ring they are about, one line long (notify.js) */
  #sliver-shape{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;fill:#000}
  .sliver{position:absolute;z-index:3;display:flex;align-items:center;justify-content:center;gap:7px;box-sizing:border-box;white-space:nowrap;
    overflow:hidden;font-size:12px;line-height:1;color:var(--ink-2);cursor:pointer;opacity:0;pointer-events:auto;padding:0 2px}
  .s-word{font-weight:700}
  .s-text{color:var(--ink-3);overflow:hidden;text-overflow:ellipsis}
  .s-more{color:var(--ink-dim);font-size:11px}
  /* Refresh lives on the card's title row: a ring click holds its card instead */
  .c-head .c-refresh{margin-left:auto;flex:none;appearance:none;border:0;background:transparent;width:26px;height:26px;border-radius:13px;display:grid;place-items:center;
    color:var(--ink-dim);cursor:pointer;transition:background-color .15s ease,color .15s ease}
  .c-head .c-refresh:hover{background:#1a1a1a;color:var(--ink)}
  .c-refresh svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .c-refresh.spinning svg{animation:spin .9s linear infinite}
  @media (prefers-reduced-motion: reduce){.c-refresh.spinning svg{animation:none}}
  /* The log: the alert switches along the top, then what came in, newest first */
  .log-mark{display:inline-grid;place-items:center;width:16px;height:16px;flex:none}
  .log-mark .bell-mark{width:16px;height:16px;fill:none;stroke:var(--ink-2);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .a-clear{margin-left:auto;appearance:none;border:0;background:none;padding:2px 0 2px 8px;font:inherit;font-size:12px;font-weight:600;color:var(--ink-dim);cursor:pointer;transition:color .15s ease}
  .a-clear:hover{color:var(--ink)}
  .a-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
  .a-chip{appearance:none;height:24px;padding:0 10px;border-radius:12px;border:1px solid #333;background:transparent;font:inherit;font-size:11px;font-weight:600;
    color:var(--ink-dim);cursor:pointer;transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .3s cubic-bezier(.34,1.56,.64,1)}
  .a-chip:hover{border-color:#555;color:var(--ink-2)}
  .a-chip.on{background:var(--ink);border-color:var(--ink);color:#000}
  .a-chip:active{transform:scale(.93)}
  .a-log{display:flex;flex-direction:column;margin:8px -8px 0}
  .a-row{appearance:none;border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;display:grid;
    grid-template-columns:16px minmax(0,1fr) auto auto;column-gap:8px;row-gap:3px;align-items:baseline;padding:8px;border-radius:10px;transition:background-color .15s ease}
  .a-row:hover{background:#141414}
  .log-content.entering .a-row{animation:a-in .44s cubic-bezier(.32,.72,.24,1) both;animation-delay:calc(var(--i) * 26ms + 60ms)}
  @keyframes a-in{from{opacity:0;translate:0 6px}to{opacity:1;translate:0 0}}
  .a-glyph{position:relative;align-self:center;width:16px;height:16px;display:grid;place-items:center}
  .a-glyph .mark{width:15px;height:15px}.a-glyph .mark svg{width:15px;height:15px;fill:currentColor}
  .a-row.fresh .a-glyph::after{content:"";position:absolute;right:-4px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--watch);box-shadow:0 0 0 2px #000}
  .a-name{font-size:12.5px;font-weight:650;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .a-word{font-size:11px;font-weight:650;white-space:nowrap}
  .a-when{min-width:44px;text-align:right;font-size:11px;color:var(--ink-dim);white-space:nowrap;font-variant-numeric:tabular-nums}
  .a-detail{grid-column:2 / -1;font-size:11.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .a-empty{margin-top:12px;font-size:12px;color:var(--ink-dim)}
  @media (prefers-reduced-motion: reduce){.log-content.entering .a-row{animation:none}.a-chip{transition:none}}

  /* ---- The other three edges -------------------------------------------------
     The rules above draw the right-hand edge, the original layout and still the default. Each block
     below mirrors or rotates that one for another edge. Two things stay in JavaScript because they
     depend on measurement: where the card and the tail sit along the pill (`placeCard`), and, on the
     flat edges, how far down or up the card clears a pill whose thickness follows its contents.

     The fillets follow one rule on every edge: the radial gradient is centred on the corner of the
     R×R square *diagonally opposite* the corner where the pill meets the screen, so what stays black
     is the concave arc between the two. */

  /* Left: the right-hand layout mirrored. */
  body[data-edge="left"] #pill{right:auto;left:0;border-radius:0 20px 20px 0;border-right:1px solid var(--edge);border-left:none}
  body[data-edge="left"] #pill::before,body[data-edge="left"] #pill::after{right:auto;left:0}
  body[data-edge="left"] #pill::before{background:radial-gradient(circle at 100% 0, transparent calc(var(--fillet) - .25px), var(--pill) calc(var(--fillet) + .75px))}
  body[data-edge="left"] #pill::after{background:radial-gradient(circle at 100% 100%, transparent calc(var(--fillet) - .25px), var(--pill) calc(var(--fillet) + .75px))}
  body[data-edge="left"] #card{left:100px;right:10px;margin-left:0;margin-right:auto}
  body[data-edge="left"] #tail{right:auto;left:69px;clip-path:path('M32 0C32 9 13.44 13.68 0 18C13.44 22.32 32 27 32 36Z')}

  /* Top and bottom: the pill lies flat, so it is a row and its thickness comes from the cells rather
     than a fixed 70 px column. The card is centred under (or over) the hovered ring by `placeCard`. */
  body[data-edge="top"] #pill,body[data-edge="bottom"] #pill{
    right:auto;left:50%;top:auto;transform:translateX(-50%);
    flex-direction:row;width:auto;height:auto;padding:12px 18px;
  }
  body[data-edge="top"] #pill::before,body[data-edge="top"] #pill::after,
  body[data-edge="bottom"] #pill::before,body[data-edge="bottom"] #pill::after{right:auto;top:auto;bottom:auto}
  body[data-edge="top"] #pill{top:0;border-radius:0 0 20px 20px;border-top:none}
  body[data-edge="top"] #pill::before{top:0;left:calc(-1 * var(--fillet));background:radial-gradient(circle at 0 100%, transparent calc(var(--fillet) - .25px), var(--pill) calc(var(--fillet) + .75px))}
  body[data-edge="top"] #pill::after{top:0;right:calc(-1 * var(--fillet));background:radial-gradient(circle at 100% 100%, transparent calc(var(--fillet) - .25px), var(--pill) calc(var(--fillet) + .75px))}
  body[data-edge="bottom"] #pill{bottom:0;border-radius:20px 20px 0 0;border-bottom:none}
  body[data-edge="bottom"] #pill::before{bottom:0;left:calc(-1 * var(--fillet));background:radial-gradient(circle at 0 0, transparent calc(var(--fillet) - .25px), var(--pill) calc(var(--fillet) + .75px))}
  body[data-edge="bottom"] #pill::after{bottom:0;right:calc(-1 * var(--fillet));background:radial-gradient(circle at 100% 0, transparent calc(var(--fillet) - .25px), var(--pill) calc(var(--fillet) + .75px))}
  /* A fixed width here, not the fluid one the upright edges use: `placeCard` measures the card to
     centre it, and a shrink-to-fit width would change as it moves. 246 is the upstream cap either way. */
  body[data-edge="top"] #card,body[data-edge="bottom"] #card{
    left:8px;right:auto;top:0;transform:none;margin-left:0;
    width:246px;max-height:calc(100% - 150px);
  }
  body[data-edge="top"] #tail,body[data-edge="bottom"] #tail{right:auto;width:36px;height:32px}
  body[data-edge="top"] #tail{clip-path:path('M0 32C9 32 13.68 13.44 18 0C22.32 13.44 27 32 36 32Z')}
  body[data-edge="bottom"] #tail{clip-path:path('M0 0C9 0 13.68 18.56 18 32C22.32 18.56 27 0 36 0Z')}

  /* Show on hover, the Mac's .onHover: folded, the notch rests as a small pill at the edge. Its size is
     the Mac's NotchLayout.pillWidth × pillHeight, 26 × 210 of its design px. 10 × 79 of this page's,
     the same unscaled measures the orb and the fillets use. The open pill keeps its whole layout and is
     clipped down to that, so everything measured off it (the card's anchor, the handles, which ring is
     under the pointer) stays true; `#rest` draws the outline the clip takes away, which is the only
     thing that shows a black pill against a black wallpaper. */
  #pill{--clip-open:inset(-40px -1px -40px -1px round 0);
    --clip-rest:inset(calc(50% - 39.5px) 0 calc(50% - 39.5px) calc(100% - 10px) round 6px 0 0 6px);
    clip-path:var(--clip-open);transition:clip-path .36s cubic-bezier(.32,.72,.24,1)}
  body.folded #pill{clip-path:var(--clip-rest)}
  body[data-edge="left"] #pill{--clip-rest:inset(calc(50% - 39.5px) calc(100% - 10px) calc(50% - 39.5px) 0 round 0 6px 6px 0)}
  body[data-edge="top"] #pill,body[data-edge="bottom"] #pill{--clip-open:inset(-1px -40px -1px -40px round 0)}
  body[data-edge="top"] #pill{--clip-rest:inset(0 calc(50% - 39.5px) calc(100% - 10px) calc(50% - 39.5px) round 0 0 6px 6px)}
  body[data-edge="bottom"] #pill{--clip-rest:inset(calc(100% - 10px) calc(50% - 39.5px) 0 calc(50% - 39.5px) round 6px 6px 0 0)}
  /* That outline is all there is of a pill on a backdrop of its own colour, a black pill on a black
     wallpaper or a light one on a white page, so it has an edge of its own: at least 3:1 against the
     pill's fill in either palette, where --edge is 1.5:1. */
  #rest{position:absolute;box-sizing:border-box;background:var(--pill);border:1px solid var(--rest-edge);pointer-events:none;
    right:0;top:50%;translate:0 -50%;width:10px;height:79px;border-right:none;border-radius:6px 0 0 6px;
    opacity:0;transition:opacity .16s ease,background-color .3s ease,border-color .3s ease}
  body.folded #rest{opacity:1;transition:opacity .2s ease .18s,background-color .3s ease,border-color .3s ease} /* arrives as the clip does */
  /* With Adaptive pill on, it follows what is behind it instead, as the iPhone's home indicator does:
     Rust reads the screen beside it (backdrop.rs) and says which backdrop it is on, and the pill takes
     the palette that stands out there. Until Rust answers, and once it is switched off, Theme decides. */
  body[data-behind="dark"] #rest{--pill:#f5f5f7;--rest-edge:#86868b}
  body[data-behind="light"] #rest{--pill:#000;--rest-edge:#5c5c5c}
  body[data-edge="left"] #rest{right:auto;left:0;border-right:1px solid var(--rest-edge);border-left:none;border-radius:0 6px 6px 0}
  body[data-edge="top"] #rest,body[data-edge="bottom"] #rest{right:auto;left:50%;top:auto;translate:-50% 0;width:79px;height:10px;border:1px solid var(--rest-edge)}
  body[data-edge="top"] #rest{top:0;border-top:none;border-radius:0 0 6px 6px}
  body[data-edge="bottom"] #rest{bottom:0;border-bottom:none;border-radius:6px 6px 0 0}
  /* The rings leave by fading and sliding a little toward the edge, one after another. the Mac's
     NotchMotion.stagger, 28 of its design px (10 here), and no scaling: the clip does the concealing */
  .cell{transition:opacity .18s ease calc(var(--i,0) * 28ms),translate .3s cubic-bezier(.32,.72,.24,1) calc(var(--i,0) * 28ms)}
  body.folded .cell{opacity:0;translate:10px 0}
  body.folded[data-edge="left"] .cell{translate:-10px 0}
  body.folded[data-edge="top"] .cell{translate:0 -10px}
  body.folded[data-edge="bottom"] .cell{translate:0 10px}
  .handle{transition:opacity .2s ease}
  body.folded .handle{opacity:0;pointer-events:none}
  @media (prefers-reduced-motion: reduce){#pill,#rest,body.folded #rest,.cell,.handle{transition:none}}

  /* The two handles, one off each end of the pill, as on the Mac (SettingsOrb and MoveHandle):
     settings past the far fillet, move past the near one. At rest each is a quarter arc tucked into
     that fillet's pocket, concentric with it and a gap inside; under the pointer the same circle
     fills in and takes its glyph. The Mac's measures, unscaled: arc radius 28.5, stroke 6.8, disc
     46.6, glyph 21. `placeHandles` puts each box's centre on its fillet's centre. */
  .handle{position:absolute;width:57px;height:57px;display:none;--arc:270deg}
  .handle.placed{display:block}
  .handle.hover{cursor:pointer}
  .handle > *{position:absolute;left:50%;top:50%;pointer-events:none;transition:opacity .2s,transform .36s cubic-bezier(.34,1.3,.64,1)}
  .h-rest{width:72px;height:72px;margin:-36px 0 0 -36px;overflow:visible;transform:rotate(var(--arc)) scale(1)}
  .h-disc{width:46.6px;height:46.6px;margin:-23.3px 0 0 -23.3px;border-radius:50%;background:var(--pill);border:1px solid var(--edge);opacity:0;transform:scale(1.1)}
  .h-ring{stroke:var(--edge)}
  .h-fill{stroke:var(--pill)}
  .h-glyph{width:21px;height:21px;margin:-10.5px 0 0 -10.5px;fill:var(--ink-2);opacity:0;
    transform:rotate(calc(var(--spins,0) * 360deg - 60deg)) scale(.5);transition:opacity .2s,transform .55s cubic-bezier(.34,1.2,.64,1)}
  .handle.hover .h-rest{opacity:0;transform:rotate(var(--arc)) scale(.86)}
  .handle.hover .h-disc{opacity:1;transform:scale(1)}
  .handle.hover .h-glyph{opacity:1;transform:rotate(calc(var(--spins,0) * 360deg)) scale(1)}
  /* Carrying: the disc goes dashed and the hand stops turning. it is being held now, not offered */
  #move.armed .h-disc{border:2px dashed var(--ink-2);background:var(--armed)}
  /* The quarter that faces the fillet: up and outward past the far end on the right, and the same two
     directions mirrored along the stack at the near end */
  body[data-edge="left"] #orb,body[data-edge="top"] #orb{--arc:180deg}
  body[data-edge="bottom"] #orb{--arc:90deg}
  #move{--arc:0deg}
  body[data-edge="left"] #move{--arc:90deg}
  body[data-edge="top"] #move{--arc:270deg}
  @media (prefers-reduced-motion: reduce){.handle > *{transition:none}}
</style>
