<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<link rel="stylesheet" href="notch-base.css">
<link rel="stylesheet" href="agent-usage.css">
</head>
<body>
<div id="root">
  <div id="card"></div>
  <div id="tail"></div>
  <span id="notch-dot" class="notch-dot" aria-hidden="true"></span>
  <button id="update-dot" class="update-dot" type="button" aria-label="Updates" aria-expanded="false" aria-controls="update-notification" hidden><span aria-hidden="true"></span></button>
  <button id="pin-handle" class="handle" type="button" aria-label="Pin" aria-pressed="false">
    <svg class="h-rest" viewBox="-36 -36 72 72" aria-hidden="true">
      <circle class="h-ring" r="28.5" fill="none" stroke-width="8.8" stroke-linecap="round" stroke-dasharray="44.77 179.07"/>
      <circle class="h-fill" r="28.5" fill="none" stroke-width="6.8" stroke-linecap="round" stroke-dasharray="44.77 179.07"/>
    </svg>
    <div class="h-disc"></div>
    <svg class="h-glyph pin" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-1 6 4 4v2H6v-2l4-4z"/><path d="M12 15v6"/></svg>
    <svg class="h-glyph bell" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 16.6V11a5.6 5.6 0 0 1 11.2 0v5.6l1.7 1.9H4.7z"/><path d="M10 21h4"/></svg>
    <span class="bell-dot"></span>
  </button>
  <button id="alert-sprout" class="sprout" type="button" aria-label="Alerts" tabindex="-1">
    <svg class="sprout-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 16.6V11a5.6 5.6 0 0 1 11.2 0v5.6l1.7 1.9H4.7z"/><path d="M10 21h4"/></svg>
  </button>
  <button id="orb" class="handle" type="button" aria-label="Settings">
    <svg class="h-rest" viewBox="-36 -36 72 72" aria-hidden="true">
      <circle class="h-ring" r="28.5" fill="none" stroke-width="8.8" stroke-linecap="round" stroke-dasharray="44.77 179.07"/>
      <circle class="h-fill" r="28.5" fill="none" stroke-width="6.8" stroke-linecap="round" stroke-dasharray="44.77 179.07"/>
    </svg>
    <div class="h-disc"></div>
    <svg class="h-glyph gear" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M10.18 3.80L10.37 1.12A11.0 11.0 0 0 1 13.63 1.12L13.82 3.80A8.4 8.4 0 0 1 16.51 4.92L16.51 4.92L18.54 3.16A11.0 11.0 0 0 1 20.84 5.46L19.08 7.49A8.4 8.4 0 0 1 20.20 10.18L20.20 10.18L22.88 10.37A11.0 11.0 0 0 1 22.88 13.63L20.20 13.82A8.4 8.4 0 0 1 19.08 16.51L19.08 16.51L20.84 18.54A11.0 11.0 0 0 1 18.54 20.84L16.51 19.08A8.4 8.4 0 0 1 13.82 20.20L13.82 20.20L13.63 22.88A11.0 11.0 0 0 1 10.37 22.88L10.18 20.20A8.4 8.4 0 0 1 7.49 19.08L7.49 19.08L5.46 20.84A11.0 11.0 0 0 1 3.16 18.54L4.92 16.51A8.4 8.4 0 0 1 3.80 13.82L3.80 13.82L1.12 13.63A11.0 11.0 0 0 1 1.12 10.37L3.80 10.18A8.4 8.4 0 0 1 4.92 7.49L4.92 7.49L3.16 5.46A11.0 11.0 0 0 1 5.46 3.16L7.49 4.92A8.4 8.4 0 0 1 10.18 3.80ZM15.3 12A3.3 3.3 0 1 0 8.7 12A3.3 3.3 0 1 0 15.3 12Z"/></svg>
  </button>
  <div id="pill"></div><!-- one .cell per provider, stacked vertically (upstream: data-driven, the same layout for 1–5 cells) -->
  <div id="rest"></div><!-- after the pill, so its outline is drawn over the clipped pill -->
  <div id="notice"></div>
</div>
<script src="runtime.js"></script>
<script src="bridge.js"></script>
<script src="localization.js"></script>
<script src="notch.js"></script>
<script src="shape.js"></script>
<script src="notch-effects.js"></script>
<script src="details.js"></script>
<script src="rim-geometry.js"></script>
<script src="update-progress.js"></script>
<script src="notify.js"></script>
<script src="notification-rim.js"></script>
<script src="motion.js"></script>
<script src="session-tools.js"></script>
</body>
</html>
