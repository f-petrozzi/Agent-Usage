<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attach to agent</title><link rel="stylesheet" href="attachments.css"></head>
<body><main>
<header><h1 id="heading">Attach to agent</h1><button id="close" aria-label="Close attachments">×</button></header>
<div id="files" aria-label="Attachments"></div>
<label for="sessions">Send to chat</label><select id="sessions" disabled><option>Loading chats…</option></select>
<p id="target-note">Choose the chat you want these files to reach.</p>
<label for="message">Message <span>(optional)</span></label><textarea id="message" rows="3" maxlength="8000" placeholder="What should the agent look at?"></textarea>
<p id="handoff-note">Copy context &amp; open puts the files in the chat’s workspace and copies their paths. Paste into the agent’s composer to attach them.</p>
<div class="actions"><button id="copy" disabled>Copy context &amp; open</button><button id="send" disabled hidden>Send to Codex</button></div>
<p id="status" role="status" aria-live="polite"></p>
<button id="paste" class="paste">Paste another screenshot</button>
<p class="limits">Drop files here to replace attachments. Up to 5 files, 8 MB each.</p>
</main><script src="attachments.js"></script></body></html>
